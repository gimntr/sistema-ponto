<!DOCTYPE html>
<!-- isso aqui avisa o navegador que é uma página HTML5 -->
<html lang="pt-BR">
<!-- abre a página toda. lang="pt-BR" fala que o idioma é português do Brasil -->

 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close" />
 <!-- aqui eu puxo do Google o ícone de "fechar" (o X) -->

 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=check" />
 <!-- e esse puxa o ícone de "check" (o certinho) -->

<my-menu></my-menu>
<!-- esse é um elemento que eu criei (componente do menu), o JS é que desenha ele na tela -->

<head>
  <!-- o head é onde ficam as configurações da página, não aparece na tela -->

  <meta charset="UTF-8">
  <!-- deixa os acentos funcionarem direitinho (senão "usuário" fica estranho) -->

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- faz a página caber no celular em vez de ficar toda pequenininha -->

  <link rel="stylesheet" href="style.css">
  <!-- liga o arquivo de CSS, que é onde ficam as cores e o visual -->

  <script src="script.js" defer></script>
  <!-- liga o arquivo de JavaScript (mostrar senha, validar campos, essas coisas) -->
  <!-- o defer faz ele só rodar depois que o HTML carregou todo -->

  <title>Acesso ao Sistema</title>
  <!-- o nome que aparece na abinha do navegador -->
</head>

<body>
  <!-- o body é tudo que aparece na tela -->

  <div class="wrap">
    <!-- caixa grandona que segura a página inteira, serve pra centralizar as coisas -->

    <div class="brand-mark">
      <!-- caixinha da logo -->

      <img src="../../assets/logo.png" alt="Logo">
      <!-- a imagem da logo. o alt é o texto que aparece se a imagem não carregar -->
    </div>

    <h2 class="page-title">CONTROLE DE HORAS</h2>
    <!-- o título grande da página -->

    <div class="card">
      <!-- o "cartão" branco onde fica o formulário -->

      <form id="loginForm">
        <!-- o formulário de login. o id é pro JavaScript conseguir achar ele -->

        <div class="field">
          <!-- bloco do campo de usuário: nome + caixa + mensagem de erro -->
          <!-- o JS pode colocar a classe "error" ou "valid" aqui pra borda ficar vermelha ou verde -->

          <label for="usuario">Nome de usuário</label>
          <!-- o textinho em cima da caixa. o for="usuario" liga ele no input, aí clicar no texto já foca no campo -->

          <div class="input-shell">
            <!-- uma caixinha em volta do input, é ela que faz a borda -->
            <!-- usei ela pra, na senha, o botão do olho ficar dentro da mesma borda -->

            <input type="text" id="usuario" placeholder="Informe seu usuário">
            <!-- aqui a pessoa digita o usuário -->
            <!-- type="text" é texto normal -->
            <!-- id="usuario" é o nome que o label e o JS usam pra achar ele -->
            <!-- placeholder é o texto cinza de dica que some quando começa a digitar -->
          </div>

          <div class="hint"></div>
          <!-- espaço pra mensagem de erro (tipo "Informe o usuário") -->
          <!-- começa vazio, o JS preenche quando precisar -->
        </div>

        <div class="field">
          <!-- bloco do campo de senha, igualzinho ao de cima -->

          <label for="senha">Senha</label>
          <!-- texto "Senha" em cima da caixa -->

          <div class="input-shell">
            <!-- caixinha em volta do campo de senha e do olho -->

            <input type="password" id="senha" placeholder="Digite sua senha">
            <!-- type="password" esconde o que a pessoa digita (fica bolinha) -->
            <!-- quando clica no olho o JS troca pra type="text" pra mostrar a senha -->

            <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar senha">
              <!-- o botão do olhinho -->
              <!-- type="button" é importante, senão ele enviaria o formulário quando clicasse -->
              <!-- id="togglePass" é pro JS saber quando clicam nele -->
              <!-- aria-label é a descrição pra quem usa leitor de tela, já que o botão só tem desenho -->

              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- o desenho do olho, feito em SVG (nunca fica borrado) -->
                <!-- width e height: tamanho de 20 pixels -->
                <!-- viewBox: o "tamanho da folha" onde o desenho é feito -->
                <!-- fill="none": sem pintar dentro, só o contorno -->
                <!-- stroke="currentColor": o traço pega a cor do texto, então dá pra mudar no CSS -->

                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <!-- o contorno do olho (aquele formato de amêndoa) -->

                <circle cx="12" cy="12" r="3"/>
                <!-- a pupila, um círculo no meio -->
              </svg>
            </button>
          </div>

          <div class="hint"></div>
          <!-- mensagem de erro do campo de senha -->
        </div>

        <button type="submit">Entrar</button>
        <!-- botão de entrar. type="submit" envia o formulário quando clica (ou aperta Enter) -->
        <!-- no CSS eu estilizo ele usando button[type="submit"] -->
      </form>
    </div>

  </div>
</body>

</html>
