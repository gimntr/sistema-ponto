<!DOCTYPE html>
<!-- avisa o navegador que é HTML5 e que o idioma é português do Brasil -->
<html lang="pt-BR">

<!-- o <head> é a parte que o usuário não vê: título, estilos, scripts... -->

<head>
  <!-- isso faz os acentos aparecerem certo (sem isso vira caractere estranho) -->
  <meta charset="UTF-8">

  <!-- isso deixa a página responsiva (se adapta ao celular) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- título que aparece na aba do navegador -->
  <title>Ajuste de ponto</title>

  <!-- fonte Public Sans (a que o CSS usa). Se não carregar, o CSS usa outra -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">

  <!-- fonte dos ícones (o check e o close das ações) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

  <!-- meu arquivo de estilo (cores, tabela, etc) -->
  <link rel="stylesheet" href="style.css">

  <!-- scripts do menu <my-menu>.
       O "defer" faz o script esperar a página carregar antes de rodar -->
  <script src="../components/menu/script.js" defer></script>
  <script type="module" src="../components/menu/generate-component.js"></script>

  <!-- meu script principal, que faz os botões funcionarem -->
  <script src="script.js" defer></script>
</head>

<!-- o <body> é tudo que aparece na tela -->

<body>

  <!-- CORRIGIDO: o <my-menu> estava DENTRO do formulário de filtros.
       Isso espremia o menu dentro da caixa branca e ele aparecia cortado.
       Agora ele fica aqui em cima, fora do .wrap e fora do form. -->
  <my-menu></my-menu>

  <!-- caixa principal: centraliza e limita a largura (a classe "wrap" está no CSS) -->
  <div class="wrap">

    <!-- cabeçalho da página, só o título -->
    <header>
      <h1>Ajuste de ponto</h1>
    </header>

    <!-- formulário dos filtros: colaborador e período.
         o id "filterForm" é como o JavaScript acha ele -->
    <form class="filters" id="filterForm">

      <!-- campo 1: escolher o colaborador -->
      <div class="field">
        <!-- o "for" tem que ser igual ao id do campo, assim clicar no texto seleciona o campo -->
        <label for="colaborador">Colaborador</label>

        <!-- o JavaScript apaga isso e coloca "Todos" + os nomes -->
        <select id="colaborador" name="colaborador">
          <option value="">Selecione</option>
        </select>
      </div>

      <!-- campo 2: data de início -->
      <div class="field">
        <label for="dataInicio">De</label>
        <input type="date" id="dataInicio" name="dataInicio">
      </div>

      <!-- campo 3: data final -->
      <div class="field">
        <label for="dataFim">Até</label>
        <input type="date" id="dataFim" name="dataFim">
      </div>

      <!-- botão de filtrar. Como é type="submit", ele envia o formulário
           e o JavaScript escuta esse envio pra filtrar a tabela -->
      <button type="submit" class="apply">Filtrar</button>
    </form>

    <!-- caixa que envolve a tabela (no celular ela vira cartões) -->
    <div class="table-panel">
      <table class="table-width">

        <!-- cabeçalho da tabela: o nome de cada coluna.
             São 8 colunas, o mesmo número do TOTAL_COLUNAS no script.js -->
        <thead>
          <tr>
            <th>Colaborador</th>
            <th>Data</th>
            <th>Entrada</th>
            <th>Saída intervalo</th>
            <th>Retorno intervalo</th>
            <th>Saída</th>
            <th>Horas trabalhadas</th>
            <th>Ações</th>
          </tr>
        </thead>

        <!-- corpo da tabela: fica vazio de propósito!
             O JavaScript cria as linhas aqui dentro usando o id "tableBody" -->
        <tbody id="tableBody"></tbody>

        <!-- rodapé da tabela: total de horas do período.
             Ele também tem 8 células, uma pra cada coluna -->
        <tfoot>
          <tr>
            <!-- coluna 1 (Colaborador): o texto "Total do período" -->
            <td class="total-label" data-label="">Total do período</td>

            <!-- colunas 2 a 6 (Data, Entrada, Saída intervalo, Retorno intervalo, Saída):
                 células vazias só pra ocupar o lugar -->
            <td data-label=""></td>
            <td data-label=""></td>
            <td data-label=""></td>
            <td data-label=""></td>
            <td data-label=""></td>

            <!-- coluna 7 (Horas trabalhadas): aqui aparece o total.
                 CORRIGIDO: o id agora é "totalPeriodo", igual ao que o script.js procura.
                 Antes não tinha esse id, então o JS não achava a célula e o total nunca aparecia -->
            <td class="total-value" id="totalPeriodo" data-label="Total">00:00</td>

            <!-- coluna 8 (Ações): vazia -->
            <td data-label=""></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</body>

</html>
