<!-- Avisa ao navegador que este documento segue o padrão moderno do HTML5 -->
<!DOCTYPE html>
<!-- 'lang="pt-BR"' avisa que a página está em português (ótimo para leitores de tela e SEO) -->
<html lang="pt-BR">

<head>
  <!-- Permite acentos e caracteres especiais como ç, ã, é sem quebrar a tela -->
  <meta charset="UTF-8">
  <!-- Garante que o site se adapte bem à tela de celulares (responsividade) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Espelho de ponto</title>

  <!-- Nossos arquivos de estilo (CSS) que dão cor e formato aos elementos -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href=".../components/menu/generate-component.css">

  <!-- Ícones do Google Fonts (usado para desenhar o lápis de editar) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  
  <!-- Fonte bonita chamada 'Public Sans' trazida do Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
</head>

<!-- ATENÇÃO DE INICIANTE: o <my-menu> estava solto antes do <body>! 
     Tudo o que aparece na tela precisa obrigatoriamente ficar dentro de <body>. -->
<body>
  <!-- Tag customizada (Web Component) que monta o seu menu dinamicamente -->
  <my-menu></my-menu>

  <!-- Div auxiliar para carregar itens ou estrutura do menu se necessário -->
  <div id="menu-container"></div>

  <!-- 'wrap' (ou container) é o embrulho geral que centraliza o conteúdo na tela -->
  <div class="wrap">
    <header>
      <h1>Espelho de ponto</h1>
    </header>

    <!-- Formulário onde o usuário escolhe filtros de data e colaborador -->
    <form class="filters" id="filterForm">

      <!-- Campo de seleção de colaborador -->
      <div class="field">
        <label for="colaborador">Colaborador</label>
        <select id="colaborador" name="colaborador">
          <option value="">Todos</option>
          <!-- As outras opções de nomes são injetadas aqui pelo script JS -->
        </select>
      </div>

      <!-- Campo de data inicial -->
      <div class="field">
        <label for="dataInicio">De</label>
        <input type="date" id="dataInicio" name="dataInicio">
      </div>

      <!-- Campo de data final -->
      <div class="field">
        <label for="dataFim">Até</label>
        <input type="date" id="dataFim" name="dataFim">
      </div>

      <!-- 'type="submit"' dispara o evento de filtrar quando clicado ou quando damos Enter -->
      <button type="submit" class="apply">Filtrar</button>

      <!-- 'type="button"' é FUNDAMENTAL aqui: se não colocar, o navegador acha que é 
           um submit e recarrega a página ao clicar em exportar -->
      <button type="button" id="btnExportar" class="btn-cancelar">Exportar para Excel</button>
    </form>

    <!-- Painel que abriga a tabela e permite barra de rolagem lateral no celular -->
    <div class="table-panel">
      <table class="table-width">
        <!-- <thead>: Cabeçalho com os títulos de cada coluna -->
        <thead>
          <tr>
            <th>Data</th>
            <th>Entrada</th>
            <th>Saída almoço</th>
            <th>Retorno almoço</th>
            <th>Saída</th>
            <th>Horas trabalhadas</th>
            <th>Ações</th>
          </tr>
        </thead>

        <!-- <tbody>: Onde as linhas com os registros de ponto entram via JavaScript.
             Ele começa vazio porque o JS preenche logo que a página abre -->
        <tbody id="tableBody"></tbody>

        <!-- <tfoot>: Rodapé fixo da tabela, reservado para o cálculo total das horas -->
        <tfoot>
          <tr>
            <td class="total-label" data-label="">Total do período</td>
            <!-- As células vazias <td> servem apenas para manter o alinhamento das 7 colunas -->
            <td data-label=""></td>
            <td data-label=""></td>
            <td data-label=""></td>
            <td data-label=""></td>
            <td class="total-value" id="tfootTotal" data-label="Total">00:00</td>
            <td data-label=""></td> <!-- Célula de fechamento sob a coluna "Ações" -->
          </tr>
        </tfoot>
      </table>

      <!-- Mensagem amigável que só aparece se a busca não encontrar nenhum registro -->
      <div class="empty-state" id="emptyState" style="display:none;">
        Nenhum lançamento encontrado para o período selecionado.
      </div>
    </div>
  </div>

  <!-- A tag <dialog> é um modal nativo do HTML moderno. 
       Por padrão fica invisível até chamarmos .showModal() no JS -->
  <dialog id="modalEditar">
    <form id="formEditar">
      <h2>Editar registro</h2>

      <!-- 'type="time"' abre o seletor nativo de relógio e aceita formato HH:MM -->
      <!-- 'required' impede salvar caso o usuário apague e deixe o campo em branco -->
      <div class="campo-edicao">
        <label for="editEntrada">Entrada</label>
        <input type="time" id="editEntrada" required>
      </div>

      <div class="campo-edicao">
        <label for="editSaidaAlmoco">Saída almoço</label>
        <input type="time" id="editSaidaAlmoco" required>
      </div>

      <div class="campo-edicao">
        <label for="editRetornoAlmoco">Retorno almoço</label>
        <input type="time" id="editRetornoAlmoco" required>
      </div>

      <div class="campo-edicao">
        <label for="editSaida">Saída</label>
        <input type="time" id="editSaida" required>
      </div>

      <div class="botoes-edicao">
        <!-- 'type="button"' para o Cancelar só rodar a função de fechar sem enviar o formulário -->
        <button type="button" id="btnCancelar" class="btn-cancelar">Cancelar</button>
        <!-- 'type="submit"' aciona a gravação dos novos horários -->
        <button type="submit" class="apply">Salvar</button>
      </div>
    </form>
  </dialog>

  <!--CARREGAMENTO DOS SCRIPTS (no fim do body para a página carregar mais rápido)-->
  
  <!-- 'defer' faz o script.js esperar o HTML carregar por inteiro antes de rodar -->
  <script src="script.js" defer></script>
  
  <!-- Script que define a lógica do componente customizado de menu -->
  <script type="module" src="../components/menu/generate-component.js"></script>
  
  <!-- Biblioteca externa SheetJS necessária para o botão de exportar gerar o .xlsx -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>

</html>
